<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-Home Universal Relay Node</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 16px; }
  .card { background: #1e293b; border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
  h2 { margin-top: 0; font-size: 1.1rem; color: #38bdf8; }
  input, select, textarea { background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 6px 8px; border-radius: 6px; width: 100%; box-sizing: border-box; }
  textarea { min-height: 130px; font: 0.78rem ui-monospace, monospace; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  button { background: #0284c7; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  button.on { background: #16a34a; }
  button.off { background: #475569; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { padding: 6px; border-bottom: 1px solid #334155; text-align: left; }
</style>
</head>
<body>
  <div class="card">
    <h2>M-Home Universal Node (10-CH GPIO & MQTT WSS)</h2>
    <div class="grid">
      <div><label>Device ID (1–26: huruf, angka, - atau _)</label><input id="deviceId" maxlength="26" pattern="[A-Za-z0-9_-]{1,26}" required></div>
      <div><label>SSID Utama</label><input id="ssid1"></div>
      <div><label>Pass Utama</label><input id="pass1" type="password" autocomplete="new-password" placeholder="Kosong = tetap"></div>
      <div><label>SSID Cadangan</label><input id="ssid2"></div>
      <div><label>Pass Cadangan</label><input id="pass2" type="password" autocomplete="new-password" placeholder="Kosong = tetap"></div>
      <div><label>MQTT WSS Host</label><input id="mqttHost"></div>
      <div><label>Port</label><input id="mqttPort" type="number"></div>
      <div><label>Path</label><input id="mqttPath"></div>
      <div><label>MQTT Username</label><input id="mqttUser"></div>
      <div><label>MQTT Password</label><input id="mqttPass" type="password" autocomplete="new-password" placeholder="Kosong = tetap"></div>
      <div style="grid-column:1/-1"><label>MQTT TLS CA Certificate (PEM; opsional ESP32, wajib ESP8266)</label><textarea id="mqttCaCert" spellcheck="false" placeholder="Tempel CA broker untuk verifikasi sertifikat. Kosongkan kolom ini untuk menghapus CA. ESP32-S3/C3 tetap dapat konek tanpa CA, tetapi sertifikat server tidak diverifikasi."></textarea></div>
      <div><label>Password AP Fallback (min. 8 karakter)</label><input id="apPassword" type="password" autocomplete="new-password" placeholder="Kosong = tetap"></div>
      <div><label>Gunakan TLS/WSS</label><input id="mqttUseSsl" type="checkbox"></div>
      <div><label>Timezone (UTC+)</label><input id="tz" type="number" min="-12" max="14" step="1" required></div>
      <div><label>Profil Board</label><input id="boardProfile" readonly></div>
      <div><label>GPIO aman untuk relay/tombol</label><input id="safeGpioPins" readonly></div>
    </div>
  </div>

  <div class="card" style="overflow-x:auto;">
    <h2>10-Channel GPIO & NTP Schedule Mapper</h2>
    <table>
      <thead>
        <tr>
          <th>CH</th><th>Nama</th><th>Relay GPIO</th><th>Btn GPIO</th><th>Active Low</th><th>Jadwal</th><th>ON (HH:MM)</th><th>OFF (HH:MM)</th><th>Kontrol</th>
        </tr>
      </thead>
      <tbody id="chBody"></tbody>
    </table>
    <br>
    <button onclick="saveCfg()">Simpan & Terapkan Konfigurasi</button>
  </div>

<script>
let cfg = {};
function cell(row, text) {
  const td = document.createElement('td');
  if (text !== undefined) td.textContent = text;
  row.appendChild(td);
  return td;
}
function input(td, type, value, update) {
  const el = document.createElement('input');
  el.type = type;
  if (type === 'checkbox') el.checked = Boolean(value);
  else if (type === 'number' && Number(value) < 0) el.value = '';
  else el.value = value ?? '';
  el.addEventListener('change', () => update(el));
  td.appendChild(el);
}
async function loadCfg() {
  const res = await fetch('/api/config');
  if (!res.ok) throw new Error('Gagal membaca konfigurasi');
  cfg = await res.json();
  ['deviceId','ssid1','ssid2','mqttHost','mqttPort','mqttPath','mqttUser','tz','mqttCaCert'].forEach(k => {
    document.getElementById(k).value = cfg[k] ?? '';
  });
  ['pass1','pass2','mqttPass','apPassword'].forEach(k => {
    const input = document.getElementById(k);
    input.value = '';
    input.placeholder = cfg[k + 'Set'] ? 'Tersimpan — kosong = tetap' : 'Belum diatur';
  });
  document.getElementById('boardProfile').value = cfg.boardProfile || 'Unknown';
  document.getElementById('safeGpioPins').value = cfg.safeGpioPins || 'Tidak tersedia';
  document.getElementById('mqttUseSsl').checked = Boolean(cfg.mqttUseSsl);
  const tb = document.getElementById('chBody');
  tb.replaceChildren();
  (cfg.channels || []).forEach((c, idx) => {
    const tr = document.createElement('tr');
    cell(tr, c.id);
    input(cell(tr), 'text', c.name, el => cfg.channels[idx].name = el.value);
    input(cell(tr), 'number', c.rPin, el => cfg.channels[idx].rPin = el.value === '' ? -1 : Number(el.value));
    input(cell(tr), 'number', c.bPin, el => cfg.channels[idx].bPin = el.value === '' ? -1 : Number(el.value));
    input(cell(tr), 'checkbox', c.aLow, el => cfg.channels[idx].aLow = el.checked);
    input(cell(tr), 'checkbox', c.sEn, el => cfg.channels[idx].sEn = el.checked);
    input(cell(tr), 'time', String(c.hOn).padStart(2,'0') + ':' + String(c.mOn).padStart(2,'0'), el => {
      if (!el.value) { el.setCustomValidity('Waktu ON wajib diisi.'); return; }
      el.setCustomValidity('');
      const [hour, minute] = el.value.split(':').map(Number);
      cfg.channels[idx].hOn = hour; cfg.channels[idx].mOn = minute;
    });
    input(cell(tr), 'time', String(c.hOff).padStart(2,'0') + ':' + String(c.mOff).padStart(2,'0'), el => {
      if (!el.value) { el.setCustomValidity('Waktu OFF wajib diisi.'); return; }
      el.setCustomValidity('');
      const [hour, minute] = el.value.split(':').map(Number);
      cfg.channels[idx].hOff = hour; cfg.channels[idx].mOff = minute;
    });
    const controls = cell(tr);
    const button = document.createElement('button');
    button.className = c.state ? 'on' : 'off';
    button.textContent = c.state ? 'ON' : 'OFF';
    button.addEventListener('click', () => toggleCh(c.id));
    controls.appendChild(button);
    tb.appendChild(tr);
  });
}
async function toggleCh(ch) {
  const res = await fetch('/api/toggle?ch=' + encodeURIComponent(ch), {method:'POST'});
  if (!res.ok) { alert('Gagal mengubah relay'); return; }
  await loadCfg();
}
async function saveCfg() {
  const deviceId = document.getElementById('deviceId').value;
  if (!/^[A-Za-z0-9_-]{1,26}$/.test(deviceId)) {
    alert('Device ID harus 1–26 karakter: huruf, angka, tanda - atau _.');
    document.getElementById('deviceId').focus();
    return;
  }
  const timezoneInput = document.getElementById('tz');
  if (timezoneInput.value.trim() === '' || !Number.isInteger(Number(timezoneInput.value)) ||
      Number(timezoneInput.value) < -12 || Number(timezoneInput.value) > 14) {
    alert('Timezone wajib diisi dengan bilangan bulat antara UTC-12 dan UTC+14.');
    timezoneInput.focus();
    return;
  }
  const timeInputs = document.querySelectorAll('#chBody input[type="time"]');
  for (const timeInput of timeInputs) {
    timeInput.setCustomValidity('');
    if (!timeInput.value || !timeInput.checkValidity()) {
      timeInput.setCustomValidity('Waktu wajib diisi.');
      timeInput.reportValidity();
      return;
    }
  }
  ['deviceId','ssid1','ssid2','mqttHost','mqttPath','mqttUser','pass1','pass2','mqttPass','mqttCaCert','apPassword'].forEach(k => cfg[k] = document.getElementById(k).value);
  cfg.mqttPort = Number(document.getElementById('mqttPort').value);
  cfg.tz = Number(document.getElementById('tz').value);
  cfg.mqttUseSsl = document.getElementById('mqttUseSsl').checked;
  const res = await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(cfg)});
  const result = await res.json();
  if (!res.ok || !result.ok) { alert('Konfigurasi ditolak: ' + (result.error || 'kesalahan tidak diketahui')); return; }
  alert('Konfigurasi tersimpan. ESP32 sedang mencoba Wi-Fi; AP tetap aktif sampai koneksi berhasil.');
  await loadCfg();
}
loadCfg().catch(err => alert(err.message));
</script>
</body>
</html>
