name: PlatformIO Build Matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Board to build and test
        required: true
        default: all
        type: choice
        options:
          - all
          - esp8266_nodemcu
          - esp32_devkit
          - esp32s3_n16r8
          - esp32c3_supermini

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target != 'all' && format('["{0}"]', inputs.target) || '["esp8266_nodemcu","esp32_devkit","esp32s3_n16r8","esp32c3_supermini"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Validate WebUI JavaScript syntax
        run: |
          for file in data/assets/js/*.js; do
            node --check "$file"
          done

      - name: Build LittleFS image
        run: pio run -e ${{ matrix.environment }} -t buildfs

      - name: Upload ESP32 DevKit flash images
        if: matrix.environment == 'esp32_devkit'
        uses: actions/upload-artifact@v4
        with:
          name: esp32-devkit-flash-images
          path: |
            .pio/build/esp32_devkit/firmware.bin
            .pio/build/esp32_devkit/partitions.bin
            .pio/build/esp32_devkit/littlefs.bin
          if-no-files-found: error
          retention-days: 14

      - name: Upload firmware and LittleFS for other boards
        if: matrix.environment != 'esp32_devkit'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.environment }}-firmware-littlefs
          path: |
            .pio/build/${{ matrix.environment }}/firmware.bin
            .pio/build/${{ matrix.environment }}/littlefs.bin
          if-no-files-found: error
          retention-days: 14
