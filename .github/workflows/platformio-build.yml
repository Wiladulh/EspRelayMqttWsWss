name: PlatformIO Build Matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp8266_nodemcu
          - esp32_devkit
          - esp32s3_n16r8
          - esp32c3_supermini
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Build ESP32 DevKit LittleFS image
        if: matrix.environment == 'esp32_devkit'
        run: pio run -e esp32_devkit -t buildfs

      - name: Upload ESP32 DevKit flash images
        if: matrix.environment == 'esp32_devkit'
        uses: actions/upload-artifact@v4
        with:
          name: esp32-devkit-flash-images
          path: |
            .pio/build/esp32_devkit/firmware.bin
            .pio/build/esp32_devkit/partitions.bin
            .pio/build/esp32_devkit/littlefs.bin
          if-no-files-found: error
          retention-days: 14
